# Haven — local stack: Postgres + one-shot migration job + Next.js app
#
#   docker compose up --build        # build images and start everything
#   docker compose down              # stop (data is kept in the volume)
#   docker compose down -v           # stop AND delete the database volume
#
# Startup order (enforced by depends_on conditions):
#   db (healthy)  ->  migrate (exits 0)  ->  app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Local-only credentials. ${VAR:-default} means: use VAR from the shell
      # or the project .env file if set, otherwise the default.
      POSTGRES_USER: ${POSTGRES_USER:-haven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haven_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-haven}
    volumes:
      # Named volume: data survives `docker compose down` / container rebuilds.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 (not 5432) so it won't clash with a Postgres installed
      # on Windows. Inside the Docker network other containers use db:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haven} -d ${POSTGRES_DB:-haven}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator # the `migrator` stage of the Dockerfile
    environment:
      # "db" is the service name above — Docker's internal DNS resolves it.
      DATABASE_URL: postgresql://${POSTGRES_USER:-haven}:${POSTGRES_PASSWORD:-haven_local_pw}@db:5432/${POSTGRES_DB:-haven}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner # the slim production stage
    restart: unless-stopped
    # Secrets (GROQ_API_KEY, NEXTAUTH_SECRET, GOOGLE_*, RESEND_API_KEY) are read
    # from .env at RUN time — they are never part of the image.
    env_file:
      - .env
    # `environment` wins over env_file, so these override values from .env:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haven}:${POSTGRES_PASSWORD:-haven_local_pw}@db:5432/${POSTGRES_DB:-haven}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      # NextAuth v5 refuses requests in production unless it trusts the host
      # (only automatic on Vercel).
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
